name: CI/CD Pipeline - ECS Fargate

on:
  push:
    branches: [ main ]

env:
  CLUSTER_NAME: my-cluster
  SERVICE_NAME: my-ecs-service
  TASK_FAMILY: my-ecs-task
  AWS_REGION: us-east-1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v1
        id: login-ecr

      - name: Build, tag, and push Docker image
        run: |
          IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPO }}:latest
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

  deploy-to-ecs:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch existing task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.TASK_FAMILY }} \
            --region ${{ env.AWS_REGION }} \
            --output json > task-def.json

      - name: Clean task definition JSON
        run: |
          jq 'del(.taskDefinition.taskDefinitionArn, 
                  .taskDefinition.revision, 
                  .taskDefinition.status, 
                  .taskDefinition.requiresAttributes, 
                  .taskDefinition.compatibilities, 
                  .taskDefinition.registeredAt, 
                  .taskDefinition.registeredBy)' task-def.json > task-def-clean.json

      - name: Update container image
        run: |
          jq --arg IMAGE "${{ env.IMAGE_URI }}" \
             '.taskDefinition.containerDefinitions[0].image = $IMAGE' \
             task-def-clean.json > task-def-final.json

      - name: Register new task definition
        run: |
          NEW_TASK_DEF=$(aws ecs register-task-definition \
            --cli-input-json file://task-def-final.json)
          NEW_REVISION=$(echo $NEW_TASK_DEF | jq -r '.taskDefinition.taskDefinitionArn')
          echo "NEW_REVISION=$NEW_REVISION" >> $GITHUB_ENV

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster ${{ env.CLUSTER_NAME }} \
            --service ${{ env.SERVICE_NAME }} \
            --task-definition ${{ env.NEW_REVISION }} \
            --force-new-deployment
