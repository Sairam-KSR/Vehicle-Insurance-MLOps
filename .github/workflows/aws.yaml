name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  continuous_integration:
    runs-on: self-hosted

    outputs:
      image_tag: ${{ steps.set-tag.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set image tag
        id: set-tag
        run: echo "image_tag=${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - name: Build, Tag, and Push Docker Image
        run: |
          IMAGE_TAG=${GITHUB_SHA}
          ECR_IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPO }}:$IMAGE_TAG

          docker build -t $ECR_IMAGE .
          docker push $ECR_IMAGE

          # also push latest (optional)
          docker tag $ECR_IMAGE ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPO }}:latest
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPO }}:latest

  continuous_deployment:
    needs: continuous_integration
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Stop existing container (if running)
        run: |
          docker ps -q --filter "name=my_app" | xargs -r docker stop
          docker ps -aq --filter "name=my_app" | xargs -r docker rm

      - name: Run Docker Image to serve users
        run: |
          IMAGE_TAG=${{ needs.continuous_integration.outputs.image_tag }}
          docker run -d \
          --name my_app \
          -e MONGODB_URL=${{ secrets.MONGODB_URL }} \
          -p 5000:5000 \
          ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPO }}:$IMAGE_TAG
