name: CI/CD Pipeline - Deploy FastAPI to ECS

on:
  push:
    branches: [main]

jobs:
  # -----------------------------
  # 1️⃣ Build Docker Image & Push to ECR
  # -----------------------------
  build-image:
    runs-on: ubuntu-latest
    outputs:
      image-uri: ${{ steps.push-image.outputs.image }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag & Push Docker Image
        id: push-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPO }}
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  # -----------------------------
  # 2️⃣ Register New ECS Task Definition
  # -----------------------------
  update-task:
    needs: build-image
    runs-on: ubuntu-latest
    outputs:
      task-def-arn: ${{ steps.register-task.outputs.task-def-arn }}

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Register ECS Task Definition
        id: register-task
        env:
          IMAGE_URI: ${{ needs.build-image.outputs.image-uri }}
          ECS_ROLE_ARN: arn:aws:iam::756810443859:role/ecsTaskExecutionRole
        run: |
          # Fetch existing task definition
          TASK_DEF=$(aws ecs describe-task-definition --task-definition my-ecs-task)
          
          # Create new task definition JSON with updated image and role
          NEW_TASK_DEF=$(echo $TASK_DEF | jq --arg IMAGE "$IMAGE_URI" --arg ROLE "$ECS_ROLE_ARN" \
            '.taskDefinition | .containerDefinitions[0].image=$IMAGE | .executionRoleArn=$ROLE | .taskRoleArn=$ROLE | {family: .family, containerDefinitions: .containerDefinitions, taskRoleArn: .taskRoleArn, executionRoleArn: .executionRoleArn, networkMode: .networkMode, requiresCompatibilities: .requiresCompatibilities, cpu: .cpu, memory: .memory}')
          
          echo "$NEW_TASK_DEF" > new-task-def.json

          # Register updated task definition
          aws ecs register-task-definition --cli-input-json file://new-task-def.json

          TASK_DEF_ARN=$(aws ecs describe-task-definition --task-definition my-ecs-task --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "task-def-arn=$TASK_DEF_ARN" >> $GITHUB_OUTPUT

  # -----------------------------
  # 3️⃣ Deploy to ECS Service
  # -----------------------------
  deploy:
    needs: update-task
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update ECS Service
        env:
          ECS_CLUSTER: my-cluster
          ECS_SERVICE: my-ecs-service
          TASK_DEF_ARN: ${{ needs.update-task.outputs.task-def-arn }}
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --task-definition $TASK_DEF_ARN \
            --force-new-deployment
